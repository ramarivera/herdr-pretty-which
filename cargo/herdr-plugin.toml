# Herdr plugin manifest. Requires Herdr >= 0.7.4 for popup panes.
id = "ramarivera.pretty-which"
name = "Pretty Which"
version = "0.3.0-beta.3"
min_herdr_version = "0.7.4"
description = "Keybindings, command launcher, and shell for Herdr."
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open keybindings"
contexts = ["workspace", "tab", "pane", "global"]
command = ["sh", "-c", 'exec "${HERDR_BIN_PATH:-herdr}" plugin pane open --plugin ramarivera.pretty-which --entrypoint overlay --focus']

[[actions]]
id = "launcher"
title = "Open launcher"
contexts = ["workspace", "tab", "pane", "global"]
command = ["sh", "-c", 'exec "${HERDR_BIN_PATH:-herdr}" plugin pane open --plugin ramarivera.pretty-which --entrypoint launcher --focus']

[[actions]]
id = "shell"
title = "Open shell"
contexts = ["workspace", "tab", "pane", "global"]
command = ["sh", "-c", 'exec "${HERDR_BIN_PATH:-herdr}" plugin pane open --plugin ramarivera.pretty-which --entrypoint shell --focus']

[[panes]]
id = "overlay"
title = "Pretty Which"
placement = "popup"
width = "90%"
height = "80%"
command = ["sh", "-c", 'if command -v herdr-pretty-which >/dev/null 2>&1; then exec herdr-pretty-which --mode keys; else exec "${CARGO_HOME:-$HOME/.cargo}/bin/herdr-pretty-which" --mode keys; fi']

[[panes]]
id = "launcher"
title = "Pretty Which Launcher"
placement = "popup"
width = "90%"
height = "80%"
command = ["sh", "-c", 'if command -v herdr-pretty-which >/dev/null 2>&1; then exec herdr-pretty-which --mode launcher; else exec "${CARGO_HOME:-$HOME/.cargo}/bin/herdr-pretty-which" --mode launcher; fi']

[[panes]]
id = "shell"
title = "Pretty Which Shell"
placement = "popup"
width = "90%"
height = 12
command = ["sh", "-c", 'if command -v herdr-pretty-which >/dev/null 2>&1; then exec herdr-pretty-which --mode shell; else exec "${CARGO_HOME:-$HOME/.cargo}/bin/herdr-pretty-which" --mode shell; fi']

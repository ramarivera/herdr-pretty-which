# Herdr plugin manifest for the local development build. Requires Herdr >= 0.7.0 plugin support.
# Cross-reference: tools/herdr-pretty-which/README.md and tools/herdr-pretty-which/cargo/herdr-plugin.toml
id = "ramarivera.pretty-which"
name = "Pretty Which"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "A tasteful which-key style training overlay for Herdr keybindings."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open pretty which"
contexts = ["workspace", "tab", "pane", "global"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "ramarivera.pretty-which", "--entrypoint", "overlay", "--placement", "overlay", "--focus"]

[[panes]]
id = "overlay"
title = "Pretty Which"
placement = "overlay"
command = ["target/release/herdr-pretty-which"]

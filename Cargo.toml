[package]
name = "herdr-pretty-which"
version = "0.1.0"
edition = "2021"
description = "A tasteful which-key style command palette for Herdr"
license = "MIT"
repository = "https://github.com/ramarivera/herdr-pretty-which"

[[bin]]
name = "herdr-pretty-which"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
fuzzy-matcher = "0.3.7"
ratatui = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"

[dev-dependencies]
assert_cmd = "2.1.1"
insta = "1.44.1"
predicates = "3.1.3"
proptest = "1.9.0"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
strip = true
